name: firefly-gen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firefly_gen
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firefly-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firefly -d firefly_gen"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-firefly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-firefly-dev-secret}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: dev
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-change-me-32-bytes-long!!}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      ARP_INTERNAL_TOKEN: ${ARP_INTERNAL_TOKEN:-change-me-internal-token}
      DATABASE_URL: postgresql+asyncpg://firefly:${POSTGRES_PASSWORD:-firefly-dev}@postgres:5432/firefly_gen
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-0}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:8080"
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
