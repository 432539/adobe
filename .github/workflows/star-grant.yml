name: star-grant

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Invite public stargazers to private full repo
        env:
          STAR_GRANT_TOKEN: ${{ secrets.STAR_GRANT_TOKEN }}
          STAR_GRANT_PUBLIC: 432539/adobe
          STAR_GRANT_PRIVATE: 432539/ad-xiaoguai
          STAR_GRANT_PERMISSION: push
          STAR_GRANT_STATE: ${{ runner.temp }}/star-grant-state.json
        run: python scripts/star_grant.py --once
